# CLEAR 运行参数
# 本文件由程序自动生成，可手工编辑；删除后重启程序会重新生成默认值。

# 参数版本（程序用于把旧版本的默认值带过来，请勿手工修改）
configVersion: 2

# 从 P 列开始读取的周数据列数（默认 20，即 P..AI）
readColumns: 20

# LOC 列（L 列）筛选值，只保留该值的数据行
locFilter: "WH_CNB"

# 主界面数据表格每页显示行数
pageSize: 200

# 表头显示方式：twoRow=周码与日期分两行（对应源文件第55/56行）；oneRow=合并为一行
headerDisplay: twoRow

# 导出方式：clean=纯数据（仅 MPS 页：表头+全部数据，含颜色与备注，默认）；
#          template=原文件格式（保留源文件的样式与宏，但只保留 MPS 页）
exportMode: clean

# 上次导出目录
exportDir: ""
